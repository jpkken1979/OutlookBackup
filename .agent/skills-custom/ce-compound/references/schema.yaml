$schema: http://json-schema.org/draft-07/schema#
title: Solution Document
description: Schema for a documented engineering solution
type: object
required:
  - name
  - description
  - type
  - trigger
  - date
  - area
  - tags
  - problem
  - root_cause
  - resolution
  - prevention

properties:
  name:
    type: string
    pattern: "^solution_[a-z0-9-]+$"
    description: Unique identifier for the solution (slug format)

  description:
    type: string
    maxLength: 120
    description: One-line summary of the solution

  type:
    type: string
    enum: [pattern]
    description: Brain node type (always pattern for solutions)

  trigger:
    type: string
    enum: [session]
    description: Trigger that created this entry

  date:
    type: string
    format: date
    description: ISO date when the solution was documented (YYYY-MM-DD)

  area:
    type: string
    description: Problem domain (e.g. nexus, brain, gateway, telegram-bot)

  tags:
    type: array
    items:
      type: string
    minItems: 2
    description: Tags for categorization

  problem:
    type: string
    description: Clear description of the problem encountered

  root_cause:
    type: string
    description: Technical root cause analysis

  resolution:
    type: string
    description: How the problem was solved

  prevention:
    type: string
    description: How to prevent this issue in the future

  related_nodes:
    type: array
    items:
      type: string
    description: Brain node IDs related to this solution

  resolution_status:
    type: string
    enum: [verified, partial, speculative]
    default: verified
    description: Confidence level of the resolution
