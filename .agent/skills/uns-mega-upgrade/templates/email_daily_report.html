<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: -apple-system, sans-serif; max-width: 600px; margin: 0 auto; background: #f5f5f5; padding: 20px;">
    <div style="background: linear-gradient(135deg, #4f46e5, #7c3aed); color: white; padding: 30px; border-radius: 12px 12px 0 0; text-align: center;">
        <h1 style="margin: 0;">📋 UNS Daily Report</h1>
        <p style="margin: 10px 0 0; opacity: 0.9;">{{date}}</p>
    </div>
    <div style="background: white; padding: 30px; border-radius: 0 0 12px 12px;">
        <h2 style="color: #1e293b; margin-top: 0;">⚠️ Alerts Summary</h2>
        <table style="width: 100%; border-collapse: collapse;">
            <tr>
                <td style="padding: 12px; background: #fef2f2; border-radius: 8px;">
                    <strong style="color: #ef4444;">🔴 Critical</strong>
                    <div style="font-size: 24px; font-weight: bold;">{{critical_count}}</div>
                </td>
                <td style="width: 10px;"></td>
                <td style="padding: 12px; background: #fffbeb; border-radius: 8px;">
                    <strong style="color: #f59e0b;">🟠 Warning</strong>
                    <div style="font-size: 24px; font-weight: bold;">{{warning_count}}</div>
                </td>
            </tr>
        </table>
        
        {{#if critical_alerts}}
        <h3 style="color: #ef4444; margin-top: 24px;">🔴 Critical Alerts</h3>
        <ul style="padding-left: 20px;">
            {{#each critical_alerts}}
            <li style="margin: 8px 0;">{{this}}</li>
            {{/each}}
        </ul>
        {{/if}}
        
        <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 24px 0;">
        <p style="color: #64748b; font-size: 14px; text-align: center;">
            UNS MEGA UPGRADE | ユニバーサル企画株式会社
        </p>
    </div>
</body>
</html>
