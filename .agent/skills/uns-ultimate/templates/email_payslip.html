<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="font-family: sans-serif; max-width: 600px; margin: 0 auto;">
    <div style="background: #4472C4; color: white; padding: 20px; text-align: center;">
        <h1>給与明細のお知らせ</h1>
        <p>Thông báo bảng lương</p>
    </div>
    <div style="padding: 30px;">
        <p>{{employee_name}} 様</p>
        <p>{{period}}の給与明細をお送りします。</p>
        <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <tr style="background: #f5f5f5;">
                <td style="padding: 10px; border: 1px solid #ddd;">総支給額</td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: right;">¥{{total_earnings}}</td>
            </tr>
            <tr>
                <td style="padding: 10px; border: 1px solid #ddd;">控除合計</td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: right;">¥{{total_deductions}}</td>
            </tr>
            <tr style="background: #e8f5e9;">
                <td style="padding: 10px; border: 1px solid #ddd; font-weight: bold;">差引支給額</td>
                <td style="padding: 10px; border: 1px solid #ddd; text-align: right; font-weight: bold; color: green;">¥{{net_salary}}</td>
            </tr>
        </table>
        <p>詳細はPDFファイルをご確認ください。</p>
    </div>
    <div style="background: #f5f5f5; padding: 20px; text-align: center; font-size: 12px; color: #666;">
        ユニバーサル企画株式会社
    </div>
</body>
</html>
