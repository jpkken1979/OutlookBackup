# Pre-commit hooks — corren ANTES de cada commit
# Setup: pip install pre-commit && pre-commit install
# Bypass de emergencia: SKIP=mypy git commit ... (no --no-verify)
# Verificar todo el repo: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.(svg|png|ico|json)$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - cryptography>=42.0.0
          - types-requests
        # Solo verificar src/ — tests tienen reglas relajadas
        files: ^src/
        args: [--config-file=pyproject.toml]

  # gitleaks — detecta API tokens / OAuth / cloud keys que detect-private-key no captura.
  # Especialmente importante para .agent/brain/ y .claude/memory/ que pueden ingestar
  # transcripts de chat donde el usuario pego secrets sin querer.
  # Bypass de emergencia (no usar): SKIP=gitleaks git commit ...
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
